claims:
  three-parts-each-an-rdf-graph:
    statement: A nanopublication consists of an assertion, its provenance and publication info, each
      an RDF graph, linked to the nanopublication through a head graph.
    quotes:
    - exact: A nanopublication consists of an assertion,
      section: Introduction
    - exact: the provenance of the assertion (simply called "provenance"), and the provenance of the
        whole nanopublication
      section: Introduction
    - exact: Each of the three parts of a nanopublication (i.e. the assertion, provenance, and publication
        info) is
      section: Basic Elements
    - exact: via triples in an additional
      section: Basic Elements
