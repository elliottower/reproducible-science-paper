claims:
  reliability-not-trust:
    interpretation:
      says: Reliance on an opaque system requires reliability, not trust.
      whose: ortmann2025oracles
    quotes:
    - exact: I argue that for epistemic reliance on an opaque system, trust is not necessary, but reliability
        is.
  proof-checkers:
    interpretation:
      says: With a proof checker downstream, the reliability of outputs does not depend on how often the
        language model errs.
      whose: ortmann2025oracles
    quotes:
    - exact: Yet, given the use of proof checkers, the doxastic reliability of the final outputs is preserved,
        irrespective of whether the LLM frequently and unreliably hallucinates.
