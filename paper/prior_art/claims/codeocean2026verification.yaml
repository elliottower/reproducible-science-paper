claims:
  capsule-packages-an-environment:
    statement: 'A Code Ocean capsule carries a built environment: installs run once when the environment
      is built, and the libraries are part of the capsule''s Docker image.'
    quotes:
    - exact: ', will be executed just once, when the environment is built, and then have their results
        cached into the environment.'
      section: Checklist item 4
    - exact: the installed libraries are also part of the Docker image available for download via
      section: Checklist item 4
  mechanical-reproducibility-not-agreement-with-the-article:
    statement: Code Ocean verifies that pressing run yields results that repeat, and does not check
      results against the article.
    quotes:
    - exact: All capsules published on Code Ocean are verified for computational reproducibility and
        quality.
      section: Opening paragraph
    - exact: 'We do not. We are not performing peer review. Our verification process ensures that
        results are reproducible in the mechanical sense of: a user presses the ''run'' button and
        gets results'
      section: Closing question
