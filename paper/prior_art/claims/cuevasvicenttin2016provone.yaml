claims:
  prospective-and-retrospective-provenance:
    statement: ProvONE covers prospective provenance, the workflow specification that produces a data
      artifact, and retrospective provenance, the steps that were executed.
    quotes:
    - exact: captures the procedure or "recipe" required to produce a data artifact.
      section: 1.2 Aspects covered by ProvONE
    - exact: scientific workflows this corresponds to the workflow specification, which details the
      section: 1.2 Aspects covered by ProvONE
    - exact: comprises the steps that were executed in the generation of a data artifact,
      section: 1.2 Aspects covered by ProvONE
  controller-orders-program-execution:
    statement: A Controller states that one Program's execution is controlled by another, so in a
      synchronous dataflow model a Program starts only once a preceding Program terminates.
    quotes:
    - exact: class can be used to specify that the execution of a given
      section: 2 Workflow Representation
    - exact: is controlled by
      section: 2 Workflow Representation
    - exact: synchronous dataflow model, a given
      section: 2 Workflow Representation
    - exact: may only start once the execution of a
      section: 2 Workflow Representation
  execution-with-program-as-plan:
    statement: An Execution is associated with the Program or Workflow it ran, which stands as the
      PROV plan.
    quotes:
    - exact: (Agent) is responsible for the Execution (Activity) with a specified Program or Workflow
      section: 3.2.11 prov:qualifiedAssociation object property
