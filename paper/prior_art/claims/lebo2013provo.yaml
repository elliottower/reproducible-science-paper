claims:
  owl2-encoding-of-the-prov-data-model:
    statement: PROV-O expresses the PROV Data Model in OWL2, as classes, properties and restrictions
      for representing and interchanging provenance information.
    quotes:
    - exact: The PROV Ontology (PROV-O) expresses the PROV Data Model
      section: Abstract
    - exact: It provides a set of classes, properties, and restrictions that can be used to represent
        and interchange provenance information generated in different systems and under different
        contexts.
      section: Abstract
  entity-activity-agent:
    statement: Three classes, Entity, Activity and Agent, are the basis of PROV-O.
    quotes:
    - exact: 'Three classes provide a basis for the rest of PROV-O:'
      section: Starting Point Terms
    - exact: is a physical, digital, conceptual, or other kind of thing with some fixed aspects; entities
        may be real or imaginary.
      prefix: 'an prov:entity '
      suffix: ' an prov:activity'
      section: Starting Point Terms
    - exact: is something that occurs over a period of time and acts upon or with entities;
      prefix: 'an prov:activity '
      suffix: ' it may include'
      section: Starting Point Terms
    - exact: is something that bears some form of responsibility for an activity taking place, for
        the existence of an entity, or for another agent's activity.
      prefix: '. an prov:agent '
      suffix: ' the three primary'
      section: Starting Point Terms
