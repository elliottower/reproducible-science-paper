claims:
  replay-script-written-by-the-skill:
    statement: Many ClawBio skills write a replay script, commands.sh, into a reproducibility/ directory
      beside their output.
    quotes:
    - exact: 'Many skills write these files under `<output_dir>/reproducibility/`:'
      section: What The Bundle Contains
    - exact: '- `commands.sh`: a replay script for the same skill run'
      section: What The Bundle Contains
    notes: 'The guide says many skills, not every skill: ''Do not assume every skill emits the exact
      same extras.'''
  outputs-checked-by-sha256:
    statement: A replay is checked by verifying SHA-256 digests the skill recorded for selected output
      files.
    quotes:
    - exact: '- `checksums.sha256`: SHA-256 digests for selected output files'
      section: What The Bundle Contains
    - exact: sha256sum -c reproducibility/checksums.sha256
      section: Verify Outputs
    - exact: '`checksums.sha256` only verifies the files that the skill originally recorded for that
        run.'
      section: Verify Outputs
