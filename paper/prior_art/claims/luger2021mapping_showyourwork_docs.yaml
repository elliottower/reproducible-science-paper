claims:
  computed-value-inserted-at-build-time:
    statement: The \variable command includes the content of a generated file in the manuscript and
      makes that file a dependency of the build, which generates it when it is missing.
    quotes:
    - exact: 'command, which allows you to include

        the content of an arbitrary file in your manuscript.'
      section: The \variable command
    - exact: 'is that the latter explicitly marks the file as a dependency of

        the manuscript in the workflow graph, which automatically generates the file if

        it is missing and re-builds the article whenever the script or rule that generates

        that file is modified.'
      section: The \variable command
    notes: The whole file's content is inserted; nothing is compared.
