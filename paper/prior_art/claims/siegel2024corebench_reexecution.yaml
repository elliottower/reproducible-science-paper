claims:
  answers-inside-an-interval-from-three-reruns:
    statement: A CORE-Bench task is solved when every reported answer falls within a 95% prediction
      interval computed from three manual reproductions of the capsule.
    quotes:
    - exact: 'For evaluation, we manually reproduced

        each capsule in the benchmark three times. We determine if an agent correctly solves a task
        if the agent’s

        reported results for all questions fall within a 95% prediction interval for every task question
        of the results

        from the three manual runs'
      section: Figure 4 caption
