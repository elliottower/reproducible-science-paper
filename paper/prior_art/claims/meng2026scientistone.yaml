    statement: Score Verification reruns the submitted solution on the benchmark's golden evaluator
      and compares the result with the score reported in the paper, which language models extract
      from the paper.
    quotes:
    - exact: 'Score Verification (I1). The paper’s reported score is extracted by LLMs from both TEX
        and PDF

        files, then compared against scores obtained by re-running the submitted solution on the golden

        evaluator. A paper passes if the two match within an adaptive tolerance that accounts for
        evaluator

        noise.'
