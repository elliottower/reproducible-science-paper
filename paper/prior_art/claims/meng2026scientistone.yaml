  numeric-sentence-tagged-with-a-log-line:
    statement: The writer tags each sentence that contains a number with a line of the experiment
      log, and a verifier compares the two numbers within a 5% relative tolerance.
    quotes:
    - exact: 'During paper generation, the writer annotates each sentence containing a number with
        a

        {source: "experimental_log.md:N"} tag linking it to a specific log line.'
      section: Section 6.2
    - exact: 'extracts the number from the sentence and the referenced log line, then checks

        whether they match within a 5% relative tolerance.'
      section: Section 6.2
  tags-exist-only-for-its-own-papers:
    statement: The check that uses the tags applies to ScientistOne alone, because no other system
      evaluated produces the records.
    quotes:
    - exact: 'This check is unique to

        ScientistOne—no other system in the evaluation produces the required provenance records.'
      section: Section 6.2
