claims:
  precondition-postcondition-invariant:
    statement: Design by Contract states a routine's obligations as a precondition on the caller,
      a postcondition on the supplier, and a class invariant over all routines of a class.
    quotes:
    - exact: 'The precondition expresses requirements that any call must satisfy if it is to

        be correct; the postcondition expresses

        properties that are ensured in return by

        the execution of the call.'
      section: The contract
    - exact: 'Others, the

        class invariants, constrain all the routines of a given class and will be discussed later.'
      section: The contract
