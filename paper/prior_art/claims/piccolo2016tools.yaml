claims:
  obstacles-are-packaging-installation-execution-documentation:
    statement: Computational findings often cannot be reproduced because of how software is packaged,
      installed and executed, and because of how analysis steps are documented.
    quotes:
    - exact: However, in practice, computational findings often cannot be reproduced because of complexities
        in how software is packaged, installed, and executed
      section: Abstract
    - exact: and because of limitations associated with how scientists document analysis steps.
      section: Abstract
    notes: The manuscript wrote 'packaging, environment drift and documentation staleness'. The source's
      terms are packaging, installation, execution and documentation of analysis steps.
