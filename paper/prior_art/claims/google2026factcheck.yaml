claims:
  required-claimreview-properties:
    statement: 'Google requires three ClaimReview properties: claimReviewed, a short summary of the
      claim; reviewRating, the assessment; and url, the page hosting the fact check.'
    quotes:
    - exact: A short summary of the claim being evaluated.
      section: Required properties
    - exact: The assessment of the claim. This object supports both a numeric and a textual assessment.
      section: Required properties
    - exact: Link to the page hosting the full article of the fact check.
      section: Required properties
  rating-schemes-are-each-publishers:
    statement: Fact-checking projects use rating schemes that differ, each documented by its publisher,
      and search results show only the textual rating.
    quotes:
    - exact: Different fact-checking projects have a variety of rating schemes which can have subtle
        differences,
      section: 'Required properties: reviewRating'
    - exact: particularly for intermediate values. It is important to document such rating schemes
        to clarify
      section: 'Required properties: reviewRating'
    - exact: The textual value is currently the only value shown in search results.
      section: 'Required properties: reviewRating'
  no-mismatch-with-page-content:
    statement: Google's guidelines require that the structured data not mismatch the page content.
    quotes:
    - exact: There must not be any mismatch between the structured data and page content (for example,
        if the
      section: Guidelines
