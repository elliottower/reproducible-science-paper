claims:
  stage-wraps-a-shell-command:
    statement: A DVC pipeline lists stages, each of which wraps a shell command.
    quotes:
    - exact: "Each stage wraps around an executable shell \ncommand\n and specifies any"
      section: Stages
  change-detected-by-content-hash:
    statement: DVC decides whether a stage must run again by comparing a hash of each dependency's
      contents with the previous one.
    quotes:
    - exact: "calculates a hash\n of file/dir contents to compare vs. previous versions."
      section: Simple dependencies
    - exact: DVC "invalidates" the stage — it knows that it needs to run again
      section: Simple dependencies
    notes: The hash comparison is between a dependency and its earlier version. The page describes
      no comparison of a rerun's output with an expected value.
