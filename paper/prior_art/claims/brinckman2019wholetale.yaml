claims:
  tale-packages-an-environment:
    statement: A tale bundles a frontend and data into a research environment built on a Docker image.
    quotes:
    - exact: 'A tale bundles a frontend and relevant data into a research

        environment. The environment itself is based on a Docker image—a lightweight, stand-alone,
        executable

        package that includes everything needed to run a research environment for a tale.'
