claims:
  ordering-constraints-over-precedence:
    statement: PROV's event ordering constraints require that a PROV instance be consistent with a
      sensible ordering of events, stated through the precedence relations precedes and strictlyPrecedes.
    quotes:
    - exact: are consistent with a sensible ordering of events
      section: 1. Introduction
    - exact: Ordering constraints employ atomic precedence relations that can
      section: 2.4 Summary of inferences and constraints
  times-are-irrelevant-to-ordering:
    statement: For checking ordering constraints, the times attached to events are irrelevant, and
      time ordering is not taken to imply event ordering, nor the reverse; ordering is relative, without
      physical clocks.
    quotes:
    - exact: with events are irrelevant; thus, there is no inference that time ordering
      section: 5.2 Event Ordering Constraints
