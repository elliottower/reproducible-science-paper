claims:
  claims-traced-through-hashes:
    statement: SciTeX Clew links a manuscript claim to the session that produced its source and traces
      backward from the claim through outputs, scripts and inputs to the raw data, checking hashes,
      without a rerun in its cache mode.
    quotes:
    - exact: manuscript claims to the computational sessions that produced them
      section: Solution
    - exact: Clew traces backward through outputs, processing scripts, and inputs to the original
        raw data
      section: Solution
    - exact: Each mode supports both <b>cache verification</b> (millisecond hash comparison)
      section: Three Verification Modes
    notes: That the claim's value is stored but not compared with the source file, and that the source
      is hashed whole, without a location inside it, are read in the code at this commit and pinned
      in watanabe2026clew_verify and watanabe2026clew_register.
