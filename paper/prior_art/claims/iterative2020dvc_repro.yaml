claims:
  dependents-of-a-failed-stage-skipped-or-run:
    statement: After a stage fails, `dvc repro` can skip the stages that depend on it (--keep-going)
      or run them (--ignore-errors).
    quotes:
    - exact: 'Continue executing, skipping stages having dependencies

        on the failed stage.'
      section: Options
    - exact: Ignore all errors when executing the stages. Unlike
      section: Options
    - exact: 'stages having dependencies on the failed stage will be

        executed.'
      section: Options
    notes: Nothing on the page says a dependent stage run under --ignore-errors is labeled as having
      run after a failure.
  dry-run:
    statement: '`dvc repro --dry` prints the commands that would run and runs none.'
    quotes:
    - exact: 'only print the commands that would be executed without actually

        executing the commands.'
      section: Options
  run-judged-as-a-whole:
    statement: 'The command''s exit status is one value for the whole pipeline: zero when every stage
      is up to date or ran, one otherwise.'
    quotes:
    - exact: 'Exit with 0 if all

        stages are up to date or if all stages are successfully executed, otherwise

        exit with 1.'
      section: Options
