claims:
  identity-ephemeral-keys-transparency-logs:
    statement: Sigstore ties signatures to existing developer identities through OIDC, signs with
      ephemeral keys, and records signatures in artifact and identity logs.
    quotes:
    - exact: it uses a protocol similar to ACME to authenticate developers through OIDC, tying signatures
        to existing and widely-used identities.
      prefix: 'u.s. government agencies and corporate targets such as google and microsoft. software
        signing, a promising mitigation for many of these attacks, has seen limited adoption in open-source
        and enterprise ecosystems. in this paper, we propose sigstore, a system to provide widespread
        software signing capabilities. to do so, we designed the system to provide baseline artifact
        signing capabilities that minimize the adoption barrier for developers. to this end, sigstore
        leverages three distinct mechanisms: first, '
      suffix: ' second, it enables developers to use ephemeral keys to sign their artifacts, reducing
        the inconvenience and risk of key management. finally, sigstore enables user authentication
        by means of artifact and identity logs, bringing transparency to software signatures. sigstore
        is quickly becoming a critical piece of internet infrastructure with more than 2.2m signatures
        over critical software such as kubernetes and distroless. more » « less award id(s): 2229703
        par id: 10470793 author(s) / creator(s): newman, zachary'
      section: Abstract
