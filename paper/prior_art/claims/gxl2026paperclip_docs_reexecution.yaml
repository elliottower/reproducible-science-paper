claims:
  invalid-extracted-value-fails-the-paper:
    statement: In `map` with an output schema, a paper whose extracted value is still invalid after
      one correction attempt fails.
    quotes:
    - exact: Invalid output gets one correction attempt. If the corrected output is still invalid,
        that paper fails.
      section: paperclip map
    notes: The value is read out of a paper by a model, not out of the output of a rerun.
