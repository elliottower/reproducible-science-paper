claims:
  lock-file-holds-the-current-state:
    statement: DVC keeps the state of a pipeline in a dvc.lock file, one per dvc.yaml, with a content
      hash for each dependency and output.
    quotes:
    - exact: To record the state of your pipeline(s) and help track its
      section: dvc.lock file
    - exact: "DVC will maintain a \ndvc.lock\n file for each \ndvc.yaml"
      section: dvc.lock file
    - exact: ', including a content hash field ('
      section: dvc.lock file
    notes: The page describes a record of the pipeline's state. That the file holds no history of
      invocations is the manuscript's reading of that description.
