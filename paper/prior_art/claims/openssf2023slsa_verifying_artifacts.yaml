claims:
  verification-compares-a-digest-and-expectations:
    statement: Verifying an artifact means checking that the provenance statement's subject matches
      the artifact's digest and that the provenance matches expected values.
    quotes:
    - exact: "Verify\n that statement’s \nsubject\n matches the digest of\nthe artifact in question."
      section: 'Step 1: Check SLSA Build level'
    - exact: "Ensuring that the values for \nbuildType\n and \nexternalParameters\n in the\nprovenance\
        \ match the expected values."
      section: How to verify
    - exact: You SHOULD compare the provenance against expected values for at least the
      section: 'Step 2: Check expectations'
