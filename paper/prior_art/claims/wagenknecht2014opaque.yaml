claims:
  translucent:
    interpretation:
      says: Dependence is translucent when the scientist has that expertise.
      whose: wagenknecht2014opaque
    quotes:
    - exact: If the scientist does possess the necessary expertise, I argue, her dependence is translucent.
      page: 475
  transparent-only-to-witness:
    interpretation:
      says: Only whoever produced or witnessed a piece of evidence can see it entirely.
      whose: wagenknecht2014opaque
    quotes:
    - exact: In experimental science, evidential contributions can be entirely transparent only to those
        who have created or eye-witnessed them.
      page: 486
  opaque-and-translucent:
    interpretation:
      says: Opaque dependence lacks the dependent scientist's expertise; translucent dependence has it.
      whose: wagenknecht2014opaque
    quotes:
    - exact: translucent dependence (which is cushioned by the dependent person’s expertise) and opaque
        dependence (which is not)
